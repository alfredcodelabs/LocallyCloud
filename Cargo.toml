# locallycloud — Rust workspace manifest
#
# locallycloud is a standalone Rust AWS emulator. Unsupported services can be
# forwarded to an optional external backend.

[workspace]
resolver = "2"
members = [
    "crates/server",
    "crates/core",
    "crates/state",
    "crates/compute",
    "crates/lambda",
    "crates/iam-sts",
    "crates/dynamodb",
    "crates/s3",
    "crates/sqs",
    "crates/sns",
    "crates/eventbridge",
    "crates/stepfunctions",
    "crates/apigateway",
    "crates/cloudformation",
    "crates/ecr",
    "crates/ecs",
    "crates/ec2",
    "crates/elbv2",
    "crates/kms",
    "crates/ssm",
    "crates/secretsmanager",
    "crates/cloudwatch-monitoring",
    "crates/cloudwatch-logs",
    "crates/rds-data",
    "crates/rds",
    "crates/analytics",
    "crates/kinesis",
    "crates/firehose",
    "crates/xray",
    "crates/cloudtrail",
    "crates/route53",
    "crates/arc",
    "crates/region-switch",
    "crates/wafv2",
    "crates/cognito",
    "crates/acm",
    "crates/cloudfront",
]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2021"
rust-version = "1.95.0"
authors = ["Alfred Rodriguez G"]
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# HTTP server / routing
axum = { version = "=0.8.9", features = ["ws"] }
tower-http = { version = "=0.6.11", features = ["trace", "cors"] }

# Low-level HTTP client for the SigV4-preserving reverse proxy (host-header control)
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"

# Concurrency
dashmap = "6"
rusqlite = { version = "=0.40.2", default-features = false, features = ["column_metadata"] }

# Errors
thiserror = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Misc
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hmac = "=0.12.1"
sha1 = "=0.10.6"
md-5 = "=0.10.6"
jsonata-core = { version = "=2.2.10", default-features = false }
aws-lc-rs = "=1.18.1"
base64 = "0.22"
flate2 = "=1.1.9"
time = { version = "0.3", features = ["formatting", "parsing"] }
zeroize = "=1.9.0"
# Zip package handling for Lambda code (deflate only; no bzip2/zstd to keep the footprint small)
zip = { version = "2", default-features = false, features = ["deflate"] }

# JWT / OIDC token validation (real RSA signature verification + JWKS)
jsonwebtoken = "=11.1.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }

# Internal crates
locallycloud-core = { path = "crates/core" }
locallycloud-state = { path = "crates/state" }
locallycloud-compute = { path = "crates/compute" }
locallycloud-lambda = { path = "crates/lambda" }
locallycloud-iam-sts = { path = "crates/iam-sts" }
locallycloud-dynamodb = { path = "crates/dynamodb" }
locallycloud-s3 = { path = "crates/s3" }
locallycloud-sqs = { path = "crates/sqs" }
locallycloud-sns = { path = "crates/sns" }
locallycloud-eventbridge = { path = "crates/eventbridge" }
locallycloud-stepfunctions = { path = "crates/stepfunctions" }
locallycloud-apigateway = { path = "crates/apigateway" }
locallycloud-cloudformation = { path = "crates/cloudformation" }
locallycloud-ecr = { path = "crates/ecr" }
locallycloud-ecs = { path = "crates/ecs" }
locallycloud-ec2 = { path = "crates/ec2" }
locallycloud-elbv2 = { path = "crates/elbv2" }
locallycloud-kms = { path = "crates/kms" }
locallycloud-ssm = { path = "crates/ssm" }
locallycloud-secretsmanager = { path = "crates/secretsmanager" }
locallycloud-cloudwatch-monitoring = { path = "crates/cloudwatch-monitoring" }
locallycloud-cloudwatch-logs = { path = "crates/cloudwatch-logs" }
locallycloud-rds-data = { path = "crates/rds-data" }
locallycloud-rds = { path = "crates/rds" }
locallycloud-analytics = { path = "crates/analytics" }
locallycloud-kinesis = { path = "crates/kinesis" }
locallycloud-firehose = { path = "crates/firehose" }
locallycloud-xray = { path = "crates/xray" }
locallycloud-cloudtrail = { path = "crates/cloudtrail" }
locallycloud-route53 = { path = "crates/route53" }
locallycloud-arc = { path = "crates/arc" }
locallycloud-region-switch = { path = "crates/region-switch" }
locallycloud-wafv2 = { path = "crates/wafv2" }
locallycloud-cognito = { path = "crates/cognito" }
locallycloud-acm = { path = "crates/acm" }
locallycloud-cloudfront = { path = "crates/cloudfront" }

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3
