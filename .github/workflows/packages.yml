name: CI and packages

on:
  pull_request:
  push:
    branches: [main, master, develop, stage]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.version.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: version
        name: Validate version and tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          bash scripts/check-package-version.sh
          if [[ "$REF_TYPE" == tag ]]; then
            expected="$(bash scripts/package-version.sh tag)"
            [[ "$REF_NAME" == "$expected" ]] || {
              echo "Tag $REF_NAME does not match Cargo.toml ($expected)" >&2
              exit 1
            }
          fi
          rust="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^rust-version = "\([^"]*\)"/\1/p;}' Cargo.toml)"
          [[ "$rust" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  architecture-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check dashboard view modules and review engine
        run: |
          for file in crates/core/src/views/architecture/*.js crates/core/src/views/architecture/tests/*.mjs tools/architecture-review-mcp/*.mjs; do
            node --check "$file"
          done
          node --test crates/core/src/views/architecture/tests/*.test.mjs
      - name: Check the optional MCP companion
        run: |
          npm ci --prefix tools/architecture-review-mcp --ignore-scripts
          node tools/architecture-review-mcp/test.mjs

  debian:
    needs: [version, extenddb]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:13
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_TEST_THREADS: '2'
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git cmake clang libclang-dev pkg-config python3
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install declared Rust toolchain
        env:
          RUST_VERSION: ${{ needs.version.outputs.rust }}
        run: |
          curl --fail --show-error --silent --location https://sh.rustup.rs -o /tmp/rustup-init.sh
          bash /tmp/rustup-init.sh -y --profile minimal --default-toolchain "$RUST_VERSION" --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install cargo-about for third-party license notices
        run: cargo install --locked cargo-about@0.8.4
      - name: Check formatting and workspace versions
        run: |
          cargo fmt --all -- --check
          cargo metadata --locked --no-deps --format-version 1 > /tmp/metadata.json
          python3 - <<'PY'
          import json, subprocess
          data = json.load(open('/tmp/metadata.json'))
          version = subprocess.check_output(['bash', 'scripts/package-version.sh', 'product'], text=True).strip()
          members = set(data['workspace_members'])
          assert all(p['version'] == version for p in data['packages'] if p['id'] in members), 'Workspace versions differ'
          PY
      - name: Build Debian 13 ${{ matrix.arch }} package
        run: |
          curl --fail --show-error --silent --location https://www.sqlite.org/2026/sqlite-autoconf-3530400.tar.gz -o /tmp/sqlite-autoconf-3530400.tar.gz
          bash packaging/debian/build-deb.sh /tmp/sqlite-autoconf-3530400.tar.gz
          [[ "$(dpkg --print-architecture)" == "${{ matrix.arch }}" ]]
          package="target/debian-package/dist/locallycloud_$(bash scripts/package-version.sh debian)_${{ matrix.arch }}.deb"
          [[ "$(dpkg-deb -f "$package" Version)" == "$(bash scripts/package-version.sh debian)" ]]
          dpkg -i "$package"
      - name: Test and lint the workspace with packaged SQLite
        run: |
          export SQLITE3_LIB_DIR="$GITHUB_WORKSPACE/target/debian-package/sqlite-3.53.4-${{ matrix.arch }}/lib"
          export SQLITE3_INCLUDE_DIR="$GITHUB_WORKSPACE/target/debian-package/sqlite-3.53.4-${{ matrix.arch }}/include"
          export SQLITE3_STATIC=1
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings
      - uses: actions/download-artifact@v8
        with:
          name: package-extenddb-${{ matrix.arch == 'amd64' && 'x86_64' || 'arm64' }}
          path: components
      - name: Test the real table worker with packaged SQLite
        run: |
          set -o pipefail
          export SQLITE3_LIB_DIR="$GITHUB_WORKSPACE/target/debian-package/sqlite-3.53.4-${{ matrix.arch }}/lib"
          export SQLITE3_INCLUDE_DIR="$GITHUB_WORKSPACE/target/debian-package/sqlite-3.53.4-${{ matrix.arch }}/include"
          export SQLITE3_STATIC=1
          worker="$GITHUB_WORKSPACE/components/locallycloud-extenddb-worker-linux-${{ matrix.arch == 'amd64' && 'x86_64' || 'arm64' }}"
          chmod u+x "$worker"
          LOCALLYCLOUD_TEST_TABLE_WORKER="$worker" cargo test -p locallycloud --locked dynamodb_engine::table_storage::tests::actual_table_worker_reauthorizes_warm_access_and_rejects_stale_generations -- --exact --nocapture 2>&1 | tee /tmp/table-storage-test.log
          grep -Fq 'Real table worker:' /tmp/table-storage-test.log
          LOCALLYCLOUD_TEST_TABLE_WORKER="$worker" cargo test -p locallycloud-dynamodb --test table_keys --locked -- --nocapture
          LOCALLYCLOUD_TEST_TABLE_WORKER="$worker" cargo test -p locallycloud --test dynamodb_sse --locked -- --nocapture 2>&1 | tee /tmp/public-sse-test.log
          grep -Fq 'Real public SSE lifecycle:' /tmp/public-sse-test.log
          LOCALLYCLOUD_TEST_TABLE_WORKER="$worker" cargo test -p locallycloud --test dynamodb_migration --locked -- --nocapture 2>&1 | tee /tmp/native-pitr-migration-test.log
          grep -Fq 'Real native PITR migration: passed' /tmp/native-pitr-migration-test.log
      - uses: actions/upload-artifact@v7
        with:
          name: package-debian-${{ matrix.arch }}
          path: target/debian-package/dist/*.deb
          if-no-files-found: error

  debian-install:
    needs: [debian, extenddb]
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:13', 'ubuntu:24.04', 'ubuntu:26.04']
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.image }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: package-debian-${{ matrix.arch }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: package-extenddb-${{ matrix.arch == 'amd64' && 'x86_64' || 'arm64' }}
          path: components
      - name: Install with apt and start as an unprivileged user
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          # APT can skip Recommends that need upgrades to preinstalled base libraries.
          apt-get install -y curl openssl dbus-user-session python3 ./dist/*.deb
          dpkg-query -W -f='${Recommends}\n' locallycloud | grep -qw dbus-user-session
          dpkg-query -W -f='${Status}\n' dbus-user-session | grep -q 'install ok installed'
          useradd --create-home tester
          # shellcheck disable=SC2016
          runuser -u tester -- bash -c '
            export LOCALLYCLOUD_KMS_MASTER_KEY="$(openssl rand -base64 32)"
            locallycloud > /tmp/locallycloud.log 2>&1 &
            pid=$!
            for _ in $(seq 1 200); do curl -fs http://127.0.0.1:4566/_locallycloud/health && break; sleep 0.1; done
            curl -fs http://127.0.0.1:4566/_locallycloud/status | grep -q "\"ready\":true" || { cat /tmp/locallycloud.log; exit 1; }
            kill "$pid"'
      - name: Install and exercise the downloaded component as an unprivileged user
        env:
          COMPONENT_ARCH: ${{ matrix.arch == 'amd64' && 'x86_64' || 'arm64' }}
        run: |
          chmod -R a+rX components
          runuser -u tester -- python3 "$GITHUB_WORKSPACE/packaging/extenddb/smoke-component.py" \
            --catalog "$GITHUB_WORKSPACE/components/extenddb-$COMPONENT_ARCH.json" --work-dir /home/tester

  arch:
    needs: version
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed rust cargo cargo-about git sqlite cmake clang
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build Arch x86_64 package as unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          bash scripts/check-package-version.sh
          cd packaging/arch
          runuser -u builder -- makepkg --cleanbuild --noconfirm
          expected="locallycloud-$(bash ../../scripts/package-version.sh arch)-1-x86_64.pkg.tar.zst"
          test -f "$expected"
          pacman -U --noconfirm "$expected"
      - uses: actions/upload-artifact@v7
        with:
          name: package-arch-x86_64
          path: packaging/arch/locallycloud-*.pkg.tar.zst
          if-no-files-found: error

  extenddb:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config clang libclang-dev perl python3
      - name: Install declared Rust toolchain and license scanner
        env:
          RUST_VERSION: ${{ needs.version.outputs.rust }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup override set "$RUST_VERSION"
          cargo install --locked cargo-about@0.8.4
      - name: Build and verify the optional component
        env:
          CARGO_BUILD_JOBS: '2'
        run: bash packaging/extenddb/build-worker.sh "$RUNNER_TEMP/extenddb-dist" "$RUNNER_TEMP/extenddb-work"
      - uses: actions/upload-artifact@v7
        with:
          name: package-extenddb-${{ matrix.arch }}
          path: ${{ runner.temp }}/extenddb-dist/*
          if-no-files-found: error

  arch-extenddb-install:
    needs: [arch, extenddb]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 15
    steps:
      - name: Install validation tools
        run: pacman -Syu --noconfirm --needed python sqlite git
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: package-arch-x86_64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: package-extenddb-x86_64
          path: components
      - name: Install and exercise the downloaded component as an unprivileged user
        run: |
          pacman -U --noconfirm ./dist/*.pkg.tar.zst
          useradd --create-home tester
          chmod -R a+rX components
          runuser -u tester -- python3 "$GITHUB_WORKSPACE/packaging/extenddb/smoke-component.py" \
            --catalog "$GITHUB_WORKSPACE/components/extenddb-x86_64.json" --work-dir /home/tester

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [architecture-review, debian, debian-install, arch, extenddb, arch-extenddb-install]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Publish release with packages and checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # GitHub replaces '~' in asset names; checksums must use the published names.
          for package in *.deb; do
            published_name="${package//\~/.}"
            if [[ "$package" != "$published_name" ]]; then
              mv -- "$package" "$published_name"
            fi
          done
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          fragments = [json.loads(Path(f'extenddb-{arch}.json').read_text()) for arch in ('x86_64', 'arm64')]
          catalog = {key:value for key,value in fragments[0].items() if key != 'artifacts'}
          artifacts = []
          for arch, fragment in zip(('x86_64', 'arm64'), fragments):
              assert {key:value for key,value in fragment.items() if key != 'artifacts'} == catalog
              assert len(fragment['artifacts']) == 1
              artifact = fragment['artifacts'][0]
              assert artifact['architecture'] == arch
              for kind, suffix in [('binary', ''), ('notices', '.LICENSES.txt')]:
                  item = artifact[kind]
                  assert item['name'] == f'locallycloud-extenddb-worker-linux-{arch}{suffix}'
                  body = Path(item['name']).read_bytes()
                  assert len(body) == item['size'] and hashlib.sha256(body).hexdigest() == item['sha256']
              artifacts.append(artifact)
          catalog['artifacts'] = artifacts
          Path('components.json').write_text(json.dumps(catalog, indent=2) + '\n')
          PY
          sha256sum -- *.deb *.pkg.tar.zst locallycloud-extenddb-worker-linux-* components.json > SHA256SUMS
          sha256sum --check SHA256SUMS
          flags=(--verify-tag --generate-notes --title "LocallyCloud $RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          gh release create "$RELEASE_TAG" "${flags[@]}" -- *.deb *.pkg.tar.zst locallycloud-extenddb-worker-linux-* components.json SHA256SUMS
