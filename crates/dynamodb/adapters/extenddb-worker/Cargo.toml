[package]
name = "locallycloud-extenddb-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
license = "Apache-2.0"
publish = false

# This optional executable has an independent dependency graph. It does not
# change the SQLite library linked into the main LocalCloud executable.
[workspace]

[dependencies]
extenddb-auth = { git = "https://github.com/ExtendDB/extenddb", rev = "b5bffa3803758c6028bb40ecdf2bfcae4a051a88" }
extenddb-core = { git = "https://github.com/ExtendDB/extenddb", rev = "b5bffa3803758c6028bb40ecdf2bfcae4a051a88" }
extenddb-engine = { git = "https://github.com/ExtendDB/extenddb", rev = "b5bffa3803758c6028bb40ecdf2bfcae4a051a88" }
extenddb-storage = { git = "https://github.com/ExtendDB/extenddb", rev = "b5bffa3803758c6028bb40ecdf2bfcae4a051a88" }
extenddb-storage-sqlite = { git = "https://github.com/ExtendDB/extenddb", rev = "b5bffa3803758c6028bb40ecdf2bfcae4a051a88" }
base64 = "0.22"
libc = "0.2"
libsqlite3-sys = { version = "=0.40.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "macros", "signal", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"
uuid = "1"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
