<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LocallyCloud</title>
  <link rel="stylesheet" href="/_locallycloud/dashboard.css" />
  <link rel="icon" type="image/svg+xml" href="/_locallycloud/brand/icon.svg" />
  <meta name="description" content="LocallyCloud dashboard: inspect local AWS resources, service activity and logs for serverless and data workflows." />
  <meta name="theme-color" content="#f7f8f3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#171d19" media="(prefers-color-scheme: dark)" />
</head>
<body>
  <a class="skip-link" href="#app" data-i18n="skipContent"></a>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="brand-title">
          <h1><a href="/dashboard/" aria-label="LocallyCloud">
            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="/_locallycloud/brand/wordmark-light.svg" />
              <img class="brand-logo" src="/_locallycloud/brand/wordmark.svg" width="208" height="36" alt="LocallyCloud" />
            </picture>
          </a></h1>
          <span class="version" id="version"></span>
        </div>
        <p class="brand-tagline" data-i18n="productTagline"></p>
      </div>
      <div class="right">
        <div class="header-controls">
          <label class="sr" for="region" data-i18n="region"></label>
          <select id="region"></select>
          <div class="identity-menu" id="identity-menu">
            <button type="button" class="identity-trigger" id="identity-label" popovertarget="identity-panel" aria-live="polite"></button>
            <div class="identity-panel" id="identity-panel" popover="auto" aria-labelledby="identity-label">
              <dl>
                <dt data-i18n="accountId"></dt><dd id="identity-account">–</dd>
                <dt id="identity-kind"></dt><dd id="identity-name">–</dd>
                <dt>ARN</dt><dd id="identity-arn">–</dd>
                <dt data-i18n="principalId"></dt><dd id="identity-id">–</dd>
              </dl>
              <p class="dim" id="identity-note"></p>
              <p class="notice" id="identity-error" role="alert" hidden></p>
              <label class="context-control"><span data-i18n="connectionProfile"></span><select id="profile"></select></label>
            </div>
          </div>
          <label class="sr" for="lang" data-i18n="language"></label>
          <select id="lang">
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="pt">Português</option>
          </select>
        </div>
        <div class="header-health">
          <span id="status" class="status offline" role="status" aria-live="polite"></span>
          <span id="ago" class="ago"></span>
        </div>
      </div>
    </header>
    <nav class="topnav" data-i18n-label="sections">
      <a href="/dashboard/" id="nav-overview" data-i18n="overview"></a>
      <a href="/dashboard/billing/" id="nav-billing" data-i18n="billing"></a>
    </nav>
    <nav class="crumbs" id="crumbs" data-i18n-label="crumbs" hidden><ol></ol></nav>
    <p id="notice" class="notice" role="alert" hidden></p>

    <div id="app" tabindex="-1">
    <main id="ov">
    <h2 class="title" data-i18n="services"></h2>
    <p class="meta" id="service-count" role="status" aria-live="polite"></p>
    <div class="toolbar">
      <label class="sr" for="search" data-i18n="search"></label>
      <input id="search" type="search" autocomplete="off" data-i18n-placeholder="search" />
      <label class="check"><input id="hideIdle" type="checkbox" /> <span data-i18n="hideIdle"></span></label>
      <label class="check" for="sort"><span data-i18n="sortBy"></span>
        <select id="sort">
          <option value="requests" data-i18n="sortRequests"></option>
          <option value="name" data-i18n="sortName"></option>
        </select>
      </label>
    </div>

    <div class="table">
      <table>
        <thead>
          <tr>
            <th scope="col" data-i18n="service"></th>
            <th scope="col" data-i18n="status"></th>
            <th scope="col" class="num" data-i18n="requests"></th>
            <th scope="col" class="num" data-i18n="apiErrors"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
        <tbody><tr id="more" hidden><td colspan="4" class="more"></td></tr></tbody>
      </table>
    </div>
    </main>
    <main id="billing" hidden>
      <h2 class="title" data-i18n="billing"></h2>
      <p class="dim" data-i18n="costNote"></p>
      <section class="stats"><div class="stat"><b id="cost">–</b><span data-i18n="estCost"></span></div></section>
      <div id="billing-services"></div>
    </main>
    <main id="detail" hidden></main>
    </div>
    <footer>
      <p>LocallyCloud · <a href="https://zento-studio.alfred2042.workers.dev" target="_blank" rel="noopener noreferrer">Zento Studio Labs</a></p>
      <p>© 2026 Alfred Rodriguez G.</p>
      <p class="attribution"><span data-i18n="serviceIcons"></span>: <a href="https://aws.amazon.com/architecture/icons/" target="_blank" rel="noopener noreferrer">AWS Architecture Icons</a> · Amazon Web Services. <span data-i18n="independentProject"></span></p>
    </footer>
  </div>

  <script defer src="/_locallycloud/dashboard-i18n.js"></script>
  <script defer src="/_locallycloud/dashboard.js"></script>
</body>
</html>
