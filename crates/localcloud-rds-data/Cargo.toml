[package]
name = "localcloud-rds-data"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
authors.workspace = true
description = "localcloud AWS RDS Data API service"

[dependencies]
localcloud-core = { path = "../localcloud-core" }
localcloud-state.workspace = true
async-trait = "=0.1.89"
axum.workspace = true
base64 = "=0.22.1"
bytes = "=1.12.1"
http = "=1.4.2"
futures-util = "=0.3.34"
tokio-postgres = "=0.7.18"
rusqlite.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json.workspace = true
sha2 = "=0.10.9"
thiserror = "=1.0.69"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "=1.26.1", features = ["v4"] }
