[package]
name = "locallycloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Native Linux AWS emulator"

[[bin]]
name = "locallycloud"
path = "src/main.rs"
required-features = ["services"]

[features]
default = ["services"]
services = [
    "dep:locallycloud-state",
    "dep:locallycloud-compute",
    "dep:locallycloud-lambda",
    "dep:locallycloud-iam-sts",
    "dep:locallycloud-dynamodb",
    "dep:locallycloud-s3",
    "dep:locallycloud-sqs",
    "dep:locallycloud-sns",
    "dep:locallycloud-eventbridge",
    "dep:locallycloud-stepfunctions",
    "dep:locallycloud-apigateway",
    "dep:locallycloud-cloudformation",
    "dep:locallycloud-ecr",
    "dep:locallycloud-ecs",
    "dep:locallycloud-ec2",
    "dep:locallycloud-elbv2",
    "dep:locallycloud-kms",
    "dep:locallycloud-ssm",
    "dep:locallycloud-ses",
    "dep:locallycloud-secretsmanager",
    "dep:locallycloud-cloudwatch-monitoring",
    "dep:locallycloud-cloudwatch-logs",
    "dep:locallycloud-rds-data",
    "dep:locallycloud-rds",
    "dep:locallycloud-analytics",
    "dep:locallycloud-kinesis",
    "dep:locallycloud-firehose",
    "dep:locallycloud-xray",
    "dep:locallycloud-cloudtrail",
    "dep:locallycloud-route53",
    "dep:locallycloud-arc",
    "dep:locallycloud-region-switch",
    "dep:locallycloud-wafv2",
    "dep:locallycloud-cognito",
    "dep:locallycloud-acm",
    "dep:locallycloud-cloudfront",
    "dep:locallycloud-architecture",
]

[dependencies]
locallycloud-core.workspace = true
locallycloud-state = { workspace = true, optional = true }
locallycloud-compute = { workspace = true, optional = true }
locallycloud-lambda = { workspace = true, optional = true }
locallycloud-iam-sts = { workspace = true, optional = true }
locallycloud-dynamodb = { workspace = true, optional = true }
locallycloud-s3 = { workspace = true, optional = true }
locallycloud-sqs = { workspace = true, optional = true }
locallycloud-sns = { workspace = true, optional = true }
locallycloud-eventbridge = { workspace = true, optional = true }
locallycloud-stepfunctions = { workspace = true, optional = true }
locallycloud-apigateway = { workspace = true, optional = true }
locallycloud-cloudformation = { workspace = true, optional = true }
locallycloud-ecr = { workspace = true, optional = true }
locallycloud-ecs = { workspace = true, optional = true }
locallycloud-ec2 = { workspace = true, optional = true }
locallycloud-elbv2 = { workspace = true, optional = true }
locallycloud-kms = { workspace = true, optional = true }
locallycloud-ssm = { workspace = true, optional = true }
locallycloud-ses = { workspace = true, optional = true }
locallycloud-secretsmanager = { workspace = true, optional = true }
locallycloud-cloudwatch-monitoring = { workspace = true, optional = true }
locallycloud-cloudwatch-logs = { workspace = true, optional = true }
locallycloud-rds-data = { workspace = true, optional = true }
locallycloud-rds = { workspace = true, optional = true }
locallycloud-analytics = { workspace = true, optional = true }
locallycloud-kinesis = { workspace = true, optional = true }
locallycloud-firehose = { workspace = true, optional = true }
locallycloud-xray = { workspace = true, optional = true }
locallycloud-cloudtrail = { workspace = true, optional = true }
locallycloud-route53 = { workspace = true, optional = true }
locallycloud-arc = { workspace = true, optional = true }
locallycloud-region-switch = { workspace = true, optional = true }
locallycloud-wafv2 = { workspace = true, optional = true }
locallycloud-cognito = { workspace = true, optional = true }
locallycloud-acm = { workspace = true, optional = true }
locallycloud-cloudfront = { workspace = true, optional = true }
locallycloud-architecture = { workspace = true, optional = true }
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
serde_json.workspace = true
serde.workspace = true
flate2.workspace = true
axum.workspace = true
http.workspace = true
uuid.workspace = true
time.workspace = true
libc = "0.2"
reqwest.workspace = true
sha2.workspace = true
zeroize.workspace = true
base64.workspace = true

bytes.workspace = true
thiserror.workspace = true
tokio-rustls.workspace = true
pem = "=3.0.6"
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }

[build-dependencies]
flate2.workspace = true

[dev-dependencies]
hmac.workspace = true
